<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="building things — a creative collective." />
        <title>building things</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main>
            <section class="slide intro" id="top" aria-labelledby="intro-title">
                <nav class="slide-navigation" aria-label="Slide 1 of 3">
                    <span>1 / 3</span>
                    <a href="#services" aria-label="Next slide">↓</a>
                </nav>
                <div class="centered-copy">
                    <h1 id="intro-title">building things</h1>
                    <p class="with">
                        <span>with</span>
                        <span class="word-window" aria-hidden="true">
                            <span class="word-stack">
                                <span>care</span>
                                <span>curiosity</span>
                                <span>craftsmanship</span>
                                <span>people</span>
                                <span>care</span>
                            </span>
                        </span>
                    </p>
                </div>
            </section>

            <section class="slide services" id="services" aria-labelledby="services-title">
                <nav class="slide-navigation" aria-label="Slide 2 of 3">
                    <span>2 / 3</span>
                    <a href="#top" aria-label="Previous slide">↑</a>
                    <a href="#contact" aria-label="Next slide">↓</a>
                </nav>
                <div class="centered-copy">
                    <p id="services-title">
                        <em><b>we can help with</b></em>
                    </p>
                    <ul aria-label="Services">
                        <li>software engineering</li>
                        <li>design</li>
                        <li>consulting</li>
                        <li>creative direction</li>
                    </ul>
                </div>
            </section>

            <section class="slide contact" id="contact" aria-labelledby="contact-title">
                <nav class="slide-navigation" aria-label="Slide 3 of 3">
                    <span>3 / 3</span>
                    <a href="#services" aria-label="Previous slide">↑</a>
                </nav>
                <form
                    class="contact-form"
                    action="mailto:hi@building-things.de?subject=New%20enquiry%20from%20building-things.de"
                    method="post"
                    enctype="text/plain"
                >
                    <p id="contact-title">let’s build something.</p>
                    <label>
                        <span>your name</span>
                        <input type="text" name="name" autocomplete="name" required />
                    </label>
                    <label>
                        <span>your email</span>
                        <input type="email" name="email" autocomplete="email" required />
                    </label>
                    <label>
                        <span>tell us about it</span>
                        <textarea name="message" rows="1" required></textarea>
                    </label>
                    <button type="submit">send</button>
                </form>
                <footer class="site-footer">
                    <a href="impressum.html">Impressum</a>
                </footer>
            </section>
        </main>
    </body>
</html>
